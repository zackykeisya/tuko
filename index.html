<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUKO POS v6 — Warm &amp; Living UI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg-main:#FDFBF7;--bg-card:#FFFFFF;--primary:#4A6B5D;--primary-hover:#3B574B;--accent:#D97706;--text-main:#2D3748;--text-muted:#718096;--line:#EAE4D8;--red:#C25454;--blue:#1565C0;--ease:cubic-bezier(0.25,0.8,0.25,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg-main);color:var(--text-main);font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:all .3s var(--ease)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.hidden{display:none!important}.mu{color:var(--text-muted);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.g{display:grid;gap:10px}.wr{flex-wrap:wrap}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:all .3s var(--ease)}
.hv:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 28px rgba(74,107,93,.14)}
.b{background:var(--primary);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700}.b:hover{background:var(--primary-hover)}
.b2{background:#fff;border:1.5px solid var(--line);padding:9px 14px;border-radius:12px;font-weight:600}.b2:hover{border-color:var(--primary)}
.bd{background:#fff;border:1.5px solid var(--red);color:var(--red);padding:9px 14px;border-radius:12px;font-weight:700}
.b:disabled,.b2:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border:1.5px solid var(--line);border-radius:99px;background:#fff;font-weight:600;white-space:nowrap}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{cursor:pointer;position:relative;padding:12px;margin:0}
.lab{background:var(--primary);color:#fff;border-radius:12px;padding:18px 8px;text-align:center;font-weight:800;margin-bottom:8px}
.nm{font-weight:600;font-size:13px;min-height:38px}
.pl{background:var(--primary);color:#fff;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.bdg{background:var(--accent);color:#fff;font-size:10px;padding:3px 9px;border-radius:99px;font-weight:800;display:inline-block}
.pc .bdg{position:absolute;top:18px;left:18px}
.hd{position:sticky;top:0;z-index:20;background:rgba(253,251,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{padding:34px 18px;transition:background 1.2s ease-in-out;display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.hero h1{font-size:34px;line-height:1.1;font-weight:800;max-width:420px;margin-bottom:10px}
.hc{background:#fff;border-radius:28px;padding:22px;text-align:center;width:250px;animation:float 3.5s ease-in-out infinite;box-shadow:0 20px 44px rgba(74,107,93,.2);cursor:pointer;position:relative}
.hc:active{animation:none;transform:scale(.97)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dot{width:8px;height:8px;border-radius:99px;background:#4A6B5D40;cursor:pointer;transition:all .3s}.dot.on{width:24px;background:var(--primary)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 110px}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--primary);color:#fff;border-radius:99px;padding:14px 22px;font-weight:800;box-shadow:0 12px 30px rgba(74,107,93,.4)}
.ov{position:fixed;inset:0;background:#2d374880;display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.md{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:420px;max-height:92vh;overflow:auto;animation:pop .3s var(--ease)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.sh{align-items:flex-end}.sh .md{border-radius:24px 24px 0 0;max-width:520px}
.md h3{color:var(--primary);margin-bottom:14px;font-size:18px}.fg{margin-bottom:12px}.fg label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
.pin{font-size:26px;text-align:center;letter-spacing:12px}

/* === DESKTOP LAYOUT === */
#k{display:flex;min-height:100vh}
.side{width:216px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex:none;z-index:40}
.logo{font-weight:800;font-size:22px;color:var(--primary);padding:4px 8px}
.nv{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;font-weight:600;text-align:left;width:100%}
.nv:hover{background:#F7F3EB}.nv.on{background:var(--primary);color:#fff}
.sb{padding:10px;border-radius:12px;background:#FEF3C7;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;margin-bottom:8px}
.sb.on{background:#E8F5E9;color:#2E7D32}.sb.on::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#2E7D32;margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
main{flex:1;padding:20px;min-width:0}.mh{display:none}
.lay{display:flex;gap:16px;align-items:flex-start}.lay>div:first-child{flex:1;min-width:0}
.cp{width:330px;position:sticky;top:16px;flex:none;margin:0}
.bar{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12px}.st b{font-size:17px;display:block;margin-top:4px}
.o{color:#D97706}.bl{color:#1565C0}.pu{color:#7B1FA2}.rd{color:var(--red)}.gr{color:#2E7D32}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--text-muted);font-weight:600}td.r,th.r{text-align:right}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sc table{min-width:560px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#E8EEEA;color:var(--primary)}
.self{background:#E3F2FD;color:var(--blue)}.nt{color:var(--accent);font-style:italic;font-size:12px}
.empty{text-align:center;padding:44px 16px;border:1.5px dashed var(--line);border-radius:18px;background:#fff}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text-main);color:#fff;padding:12px 22px;border-radius:99px;z-index:90;font-weight:600;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.warn{background:#FEF3C7;border:1px solid #F5E6C8;color:var(--accent);padding:12px 16px;border-radius:14px;margin-bottom:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#rc{font-family:'Courier New',monospace;font-size:12px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar select{width:auto;min-width:140px}

/* === TABLET === */
@media(max-width:1024px){
 .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
 .cp{width:290px}
 .stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
}

/* === MOBILE FIX (< 860px) === */
@media(max-width:860px){
 #k{display:block!important;min-height:100vh;padding-bottom:70px!important} 
 main{padding:12px 12px 20px!important;width:100%!important}
 .mh{display:flex!important;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}

 /* Bottom Nav Bar */
 .side{
  position:fixed!important;
  bottom:0!important; left:0!important; right:0!important; top:auto!important;
  width:100%!important; height:auto!important;
  flex-direction:row!important;
  justify-content:space-around!important;
  padding:8px 4px!important;
  background:#fff!important;
  border-top:1px solid var(--line)!important;
  border-right:0!important;
  box-shadow:0 -4px 16px rgba(74,107,93,.08)!important;
  z-index:9999!important;
 }
 .side .logo, .side .sb, .side .xt{display:none!important}
 .side .nv{
  flex-direction:column!important;
  gap:4px!important;
  font-size:10px!important;
  padding:6px 2px!important;
  justify-content:center!important;
  text-align:center!important;
  border-radius:10px!important;
  flex:1!important;
 }
 .side .nv span:first-child{font-size:18px!important;margin-bottom:2px!important}
 .side .nv.on{background:var(--primary)!important;color:#fff!important}
 
 /* Layout Konten */
 .lay{display:block!important}
 .cp{width:100%!important;position:static!important;margin-top:14px!important}
 
 /* Floating bar bawah */
 .bar{
  display:flex!important;position:fixed!important;
  left:12px!important; right:12px!important; bottom:80px!important;
  z-index:24!important;background:var(--primary)!important;color:#fff!important;
  border-radius:16px!important;padding:13px 18px!important;
  justify-content:space-between!important;font-weight:800!important;
  box-shadow:0 8px 24px rgba(74,107,93,.35)!important;
 }
 
 .hero h1{font-size:28px}
 .stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important}
}

/* === SMALL PHONES (< 640px) === */
@media(max-width:640px){
 body{font-size:13px}
 .hd{padding:10px 12px}
 .hd b{font-size:17px!important}
 .wrap{padding:14px 12px 130px}
 .hero{padding:24px 12px;gap:16px}
 .hero h1{font-size:23px;max-width:100%}
 .hero .hc{width:100%;max-width:290px;padding:16px}
 .hero .hc .lab{padding:24px 8px;font-size:17px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
 .pc{padding:9px}
 .lab{padding:14px 6px;font-size:13px}
 .nm{font-size:11.5px;min-height:32px}
 .pl{width:26px;height:26px;font-size:15px}
 .card{padding:13px;border-radius:14px}
 .md{padding:16px;border-radius:18px;max-height:94vh}
 .stats{grid-template-columns:repeat(2,1fr);gap:8px}
 .st{padding:11px;font-size:11px}.st b{font-size:14.5px}
 .fab{right:12px;bottom:80px;padding:12px 18px;font-size:13px}
 .b,.b2,.bd{padding:9px 12px;font-size:13px}
 .mh b{font-size:18px!important}
 .selbar{width:100%;justify-content:space-between}
 .selbar select{flex:1;min-width:100px;font-size:12px;padding:8px 10px}
}

/* === EXTRA SMALL (< 400px) === */
@media(max-width:400px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .stats{grid-template-columns:1fr}
 .hero h1{font-size:20px}
}

@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:58mm}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="mdl"></div>
<div id="tst"></div>
<script>
/* ===== Storage & Seed (key: tuko_v5) ===== */
const LS='tuko_v5',$=i=>document.getElementById(i);
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date().toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
const iso=()=>new Date().toISOString();
const short=n=>{const t=String(n).replace(/\(.*?\)/g,'').trim();return t.length<=10?t:t.split(' ').slice(0,2).join(' ')};
const mk=(id,name,price,cat,badge)=>({id,name,price,hpp:0,cat,badge,active:true});
function seed(){return{pin:'1234',kasirPin:'8888',shift:null,shiftHistory:[],cashierName:'Kasir 1',dividendPct:30,qrisImage:'',
menu:[mk(1,'Tuko Original (1 Teko)',13000,'Teh/Teko',true),mk(2,'Tuko Leci (1 Teko)',16000,'Teh/Teko',true),mk(3,'Tuko Lemon (1 Teko)',16000,'Teh/Teko',true),mk(4,'Tuko Beer (1 Teko)',18000,'Teh/Teko',true),mk(5,'Sate Telur Puyuh',4000,'Sate-satean',false),mk(6,'Sate Ati Ampela',3000,'Sate-satean',false),mk(7,'Kopi Tubruk',12000,'Kopi',false),mk(8,'Aneka Gorengan (5pcs)',15000,'Gorengan',false)],
cart:[],tableNote:'',discount:0,tabs:[],expenses:[],trans:[],log:[]}}
let S=null;try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!Array.isArray(S.menu))S=seed();
['shiftHistory','tabs','expenses','trans','log','cart'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
if(S.dividendPct==null)S.dividendPct=30;if(!S.kasirPin)S.kasirPin='8888';if(!S.pin)S.pin='1234';if(S.qrisImage==null)S.qrisImage='';if(S.shift===undefined)S.shift=null;
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Penyimpanan penuh')}};
const logA=a=>{S.log.unshift({a,ts:now()});S.log=S.log.slice(0,200);save()};
function toast(m){$('tst').innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>{$('tst').innerHTML=''},2000)}
const CATS={bahan:'Bahan Baku',ops:'Operasional',lainnya:'Lainnya'};

/* ===== State ===== */
let cust=true,view='pos',AU=false,M=null,Q='',KC='Semua',CT=[];
let C={table:'',cart:[],cat:'Semua',open:false,idx:0,done:null},TM=null;
const BG=['#EEF3EF','#FDF3D6','#F8EBD3','#EAF0EC'];
const P={exp:{n:10,p:0},sold:{n:10,p:0}};let HF={d:'',k:''},MON='',chart=null;

/* ===== Helpers keuangan ===== */
const shiftOn=()=>S.shift&&S.shift.status==='active';
const sT=()=>shiftOn()?S.trans.filter(t=>t.shiftId===S.shift.id):[];
const sE=()=>shiftOn()?S.expenses.filter(e=>e.shiftId===S.shift.id):[];
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const sCash=()=>sum(sT().filter(t=>t.method==='cash'),t=>t.total),sQ=()=>sum(sT().filter(t=>t.method==='qris'),t=>t.total);
const sEx=()=>sum(sE(),e=>e.amount),sGross=()=>sum(sT(),t=>t.total);
const sExp=()=>shiftOn()?S.shift.openingCash+sCash()-sEx():0;
const gross=()=>sum(S.trans,t=>t.total),totEx=()=>sum(S.expenses,e=>e.amount),net=()=>gross()-totEx();
const day=t=>(t.tsRaw||'').slice(0,10);
function sold(){const a={};S.trans.forEach(t=>t.items.forEach(i=>{const o=a[i.id]||(a[i.id]={name:i.name,qty:0,rev:0});o.qty+=i.qty;o.rev+=i.qty*i.price}));return Object.values(a).sort((x,y)=>y.qty-x.qty)}
function sl(k,arr){const o=P[k];o.p=Math.min(o.p,Math.max(0,Math.ceil(arr.length/o.n)-1));return arr.slice(o.p*o.n,(o.p+1)*o.n)}
function pager(k,len){const o=P[k];return `<div class="row" style="margin-top:10px"><select style="width:80px" onchange="P.${k}.n=+this.value;P.${k}.p=0;render()">${[5,10,25,50,100].map(n=>`<option ${o.n==n?'selected':''}>${n}</option>`).join('')}</select><span class="row"><button class="b2" onclick="P.${k}.p=Math.max(0,P.${k}.p-1);render()">‹</button><span>${o.p+1}/${Math.max(1,Math.ceil(len/o.n))}</span><button class="b2" onclick="P.${k}.p++;render()">›</button></span></div>`}

/* ===== Pembeli ===== */
function initCust(){const q=new URLSearchParams(location.search).get('meja')||new URLSearchParams(location.search).get('table');
 if(q){C.table=String(q).padStart(2,'0')}else{M={t:'tbl'}}
 clearInterval(TM);TM=setInterval(()=>{C.idx++;updateShowcaseDOM()},4000)}
const showList=()=>{const a=S.menu.filter(m=>m.active!==false);const b=a.filter(m=>m.badge);return(b.length?b:a).slice(0,4)};
function updateShowcaseDOM(){const l=showList();if(!l.length||!$('hero'))return;const i=C.idx%l.length,m=l[i];
 $('hero').style.background=BG[i%4];$('hl').textContent=short(m.name);$('hn').textContent=m.name;$('hp').textContent=rp(m.price);
 [...document.querySelectorAll('.dot')].forEach((d,j)=>d.classList.toggle('on',j===i))}

/* ===== Smooth scroll to catalog + filter by category ===== */
function scrollToCat(m){
 if(!m)return;
 const cat=m.cat||'Semua';
 C.cat=CT.includes(cat)?cat:'Semua';
 render();
 setTimeout(()=>{
  const el=$('menu');
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  toast('Kategori: '+C.cat);
 },80);
}

function rCust(){
 const act=S.menu.filter(m=>m.active!==false);CT=['Semua',...new Set(act.map(m=>m.cat))];
 const it=act.filter(m=>C.cat==='Semua'||m.cat===C.cat),n=C.cart.reduce((a,i)=>a+i.qty,0),tl=sum(C.cart,i=>i.price*i.qty);
 const l=showList(),i=C.idx%Math.max(1,l.length),m=l[i]||{name:'TUKO',price:0,cat:'Semua'};
 if(C.done)return `<div class="wrap" style="text-align:center;padding-top:60px"><div style="font-size:60px">✅</div><h2 style="margin:10px 0">Pesanan terkirim!</h2><p class="mu" style="margin-bottom:18px">Meja ${esc(C.table)} · ${rp(C.done.total)} · Menunggu pembayaran di kasir.</p><button class="b" onclick="C.done=null;render()">Pesan lagi</button></div>`;
 return `<header class="hd"><b style="font-size:20px;color:var(--primary)">TUKO <span class="mu" style="font-weight:500">Tuangin · Puterin · Nikmatin</span></b><span class="row">${C.table?`<button class="chip on" onclick="M={t:'tbl'};render()">Meja ${esc(C.table)} ✎</button>`:''}<button class="b2" title="Staff" onclick="M={t:'pin',v:'',staff:1};render()">🔒</button></span></header>
 <section class="hero" id="hero" style="background:${BG[i%4]}"><div><h1>Teh teko &amp; sate hangat, langsung dari meja Anda.</h1><p class="mu" style="margin-bottom:14px">Pilih menu, tulis catatan, kirim ke kasir.</p><a class="b" href="#menu" style="text-decoration:none;display:inline-block">Lihat menu</a></div>
 <div><div class="hc" onclick="scrollToCat(${JSON.stringify(m).replace(/"/g,'&quot;')})"><span class="bdg">⭐ Best Seller</span><div class="lab" id="hl" style="margin:16px 0;font-size:20px;padding:34px 8px">${esc(short(m.name))}</div><b id="hn">${esc(m.name)}</b><div id="hp" style="font-size:22px;font-weight:800;color:var(--primary)">${rp(m.price)}</div><button class="b2" style="margin-top:10px;width:100%" onclick="event.stopPropagation();scrollToCat(${JSON.stringify(m).replace(/"/g,'&quot;')})">Pesan Ini</button></div>
 <div class="dots">${l.map((_,j)=>`<span class="dot ${j===i?'on':''}" onclick="C.idx=${j};updateShowcaseDOM()"></span>`).join('')}</div></div></section>
 <div class="wrap" id="menu"><h2 style="margin-bottom:10px">Menu</h2><div class="chips">${CT.map((c,j)=>`<button class="chip ${C.cat===c?'on':''}" onclick="C.cat=CT[${j}];render()">${esc(c)}</button>`).join('')}</div>
 <div class="grid" id="custCatalog">${it.map(m=>`<div class="card pc hv" onclick="cAdd(${m.id})">${m.badge?'<span class="bdg">1 Teko</span>':''}<div class="lab">${esc(short(m.name))}</div><div class="nm">${esc(m.name)}</div><div class="row"><b>${rp(m.price)}</b><span class="pl">+</span></div></div>`).join('')||'<p class="mu">Belum ada menu.</p>'}</div></div>
 ${n?`<button class="fab" onclick="C.open=true;render()">🛒 ${n} · ${rp(tl)}</button>`:''}`}

function cAdd(id){const m=S.menu.find(x=>x.id===id);if(!m)return;const c=C.cart.find(x=>x.id===id);if(c)c.qty++;else C.cart.push({id:m.id,name:m.name,price:m.price,cat:m.cat,hpp:0,badge:m.badge,active:true,qty:1,note:''});render();toast('+ '+m.name)}
function cQty(id,d){const c=C.cart.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)C.cart=C.cart.filter(x=>x.id!==id);render()}
function cNote(id,v){const c=C.cart.find(x=>x.id===id);if(c)c.note=v}

/* UPDATE CHART: Hanya menampilkan data BULAN TERPILIH */
function drawChart(){
 if(chart){chart.destroy();chart=null}
 const c=$('ch');if(!c||typeof Chart==='undefined')return;
 
 const mt=S.trans.filter(t=>day(t).slice(0,7)===MON);
 const me=S.expenses.filter(e=>day(e).slice(0,7)===MON);
 const o=sum(mt,t=>t.total), x=sum(me,e=>e.amount), l=o-x;

 chart=new Chart(c,{
   type:'bar',
   data:{
     labels:['Omzet','Pengeluaran','Laba Bersih'],
     datasets:[{
       data:[o, x, l],
       backgroundColor:['#4A6B5D','#C25454','#D97706'],
       borderRadius:6,
       maxBarThickness:60
     }]
   },
   options:{
     responsive:true,
     maintainAspectRatio:false,
     plugins:{legend:{display:false}},
     scales:{
       y:{beginAtZero:true, ticks:{callback:v=>rp(v).replace('Rp','')}},
       x:{grid:{display:false}}
     }
   }
 })
}

 logA('Menu: '+n);M=null;render()}

 const f=a=>a.map(o=>{const r={};Object.keys(o).forEach(k=>{r[k]=(o[k]!==null&&typeof o[k]==='object')?JSON.stringify(o[k]):o[k]});return r});
 const wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(f(a.length?a:[{}])),n);
 add('Menu',S.menu);add('Transaksi',S.trans);add('Pengeluaran',S.expenses);add('Shift',S.shiftHistory);add('Tab',S.tabs);add('Log',S.log);add('Pengaturan',[{dividendPct:S.dividendPct,pin:S.pin,kasirPin:S.kasirPin,cashierName:S.cashierName}]);
 XLSX.writeFile(wb,'tuko-backup-'+iso().slice(0,10)+'.xlsx')}
function impXls(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{
 const wb=XLSX.read(e.target.result,{type:'array'}),rd=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n]).map(o=>{Object.keys(o).forEach(k=>{const v=o[k];if(typeof v==='string'&&/^[\[{]/.test(v)){try{o[k]=JSON.parse(v)}catch(x){}}});return o}).filter(o=>Object.keys(o).length):[];
 if(!confirm('Import akan menimpa data saat ini. Lanjut?'))return;
 const m=rd('Menu');if(m.length)S.menu=m;S.trans=rd('Transaksi');S.expenses=rd('Pengeluaran');S.shiftHistory=rd('Shift');S.tabs=rd('Tab');S.log=rd('Log');
 const p=rd('Pengaturan')[0];if(p){S.dividendPct=+p.dividendPct||30;S.pin=String(p.pin||'1234');S.kasirPin=String(p.kasirPin||'8888');S.cashierName=p.cashierName||'Kasir 1'}
 save();render();toast('Import berhasil')}catch(x){toast('File tidak valid')}};r.readAsArrayBuffer(f)}

/* ===== 5) Shift ===== */
function vShift(){
 if(!shiftOn())return `<div class="empty"><div style="font-size:40px">🕐</div><b>Belum ada shift aktif</b><p class="mu" style="margin-bottom:14px">Buka shift untuk mulai transaksi.</p><button class="b" onclick="openShift()">Buka Shift Baru</button></div>`;
 const s=S.shift,mn=Math.floor((Date.now()-new Date(s.startedAt))/60000);
 return `<div class="card" style="border-left:4px solid var(--primary)"><span class="tag" style="background:#E8F5E9;color:#2E7D32;animation:blink 1.4s infinite">● AKTIF</span><h3 style="margin:6px 0">${esc(s.name)}</h3><div class="mu">Kasir: ${esc(s.cashierName)} · Durasi ${Math.floor(mn/60)}j ${mn%60}m</div>
 <div class="g" style="margin-top:12px"><div class="row"><span>Modal Awal</span><span>${rp(s.openingCash)}</span></div><div class="row"><span>Penjualan Tunai</span><span>+${rp(sCash())}</span></div><div class="row"><span>Penjualan QRIS</span><span>${rp(sQ())}</span></div><div class="row"><span>Pengeluaran</span><span>−${rp(sEx())}</span></div><div class="row" style="font-weight:800;font-size:16px;color:var(--primary);border-top:2px dashed var(--line);padding-top:8px"><span>Kas Diharapkan</span><span>${rp(sExp())}</span></div></div></div>
 <div class="stats"><div class="st">Transaksi<b>${sT().length}</b></div><div class="st">Pengeluaran<b class="rd">${rp(sEx())}</b></div><div class="st">Omzet Shift<b>${rp(sGross())}</b></div><div class="st">Laba Bersih<b class="gr">${rp(sGross()-sEx())}</b></div></div>
 <button class="b" style="width:100%;padding:15px" onclick="M={t:'close',a:0,note:''};render()">🔒 Tutup Shift &amp; Setor Uang</button>`}
function openShift(){M={t:'open'};render()}
function doOpen(){const n=$('sn').value.trim(),k=$('sk').value.trim(),c=+$('sc').value;if(!n||!k||!(c>0)){toast('Lengkapi nama, kasir & modal awal');return}
 S.shift={id:'SH-'+Date.now(),name:n,cashierName:k,startedAt:iso(),startedAtLabel:now(),openingCash:c,status:'active'};S.cashierName=k;logA('Shift dibuka '+n+' '+rp(c));M=null;render();toast('Shift dibuka')}
function closeUpd(){const a=+$('ca').value||0,v=a-sExp();M.a=a;$('cv').textContent=(v>0?'+':'')+rp(v);$('cv').className=v?'rd':'gr';$('cnw').classList.toggle('hidden',!v)}
function doClose(){const a=+$('ca').value||0,v=a-sExp(),note=$('cn').value.trim();if(v&&!note){toast('Isi catatan selisih');return}
 const r={id:S.shift.id,name:S.shift.name,cashierName:S.shift.cashierName,startedAt:S.shift.startedAt,startedAtLabel:S.shift.startedAtLabel,closedAt:iso(),closedAtLabel:now(),openingCash:S.shift.openingCash,cashSales:sCash(),qrisSales:sQ(),expenseTotal:sEx(),grossRevenue:sGross(),netProfit:sGross()-sEx(),expectedCash:sExp(),actualCash:a,variance:v,note,transCount:sT().length};
 S.shiftHistory.unshift(r);S.shift=null;S.cart=[];S.discount=0;S.tableNote='';logA('Shift ditutup, setoran '+rp(a));M={t:'det',r};render()}

/* ===== Pembayaran ===== */
function openPay(){M={t:'pay',m:'cash',c:0};render()}
function payUpd(){const tl=cTot(),ok=M.m==='qris'||M.c>=tl;if($('chg')){$('chg').textContent=(ok?'Kembalian ':'Kurang ')+rp(Math.abs(M.c-tl));$('chg').className=ok?'gr':'rd'}if($('pok'))$('pok').disabled=!ok}
function doPay(){const tl=cTot();if(M.m==='cash'&&M.c<tl)return;checkout(M.m,M.m==='cash'?M.c:tl)}
function upQris(inp){const f=inp.files[0];if(!f)return;if(f.size>2*1024*1024){toast('Maks 2MB');inp.value='';return}const r=new FileReader();r.onload=e=>{S.qrisImage=e.target.result;save();render();toast('QRIS tersimpan')};r.readAsDataURL(f)}
function doReset(){if($('rt').value!=='RESET'){toast('Ketik RESET');return}const m={trans:'trans',exp:'expenses',sh:'shiftHistory',tab:'tabs',log:'log'};
 Object.keys(m).forEach(k=>{if($('r_'+k).checked)S[m[k]]=[]});if($('r_menu').checked)S.menu=seed().menu;save();M=null;render();toast('Data direset')}

/* ===== Modal lintas menu ===== */
const fg=(l,h)=>`<div class="fg"><label>${l}</label>${h}</div>`,acts=(ok,t,dis)=>`<div class="row" style="margin-top:16px"><button class="b2" style="flex:1" onclick="M=null;render()">Batal</button><button class="b" style="flex:1" onclick="${ok}" ${dis||''}>${t}</button></div>`;
function rM(){const t=M.t;let h='',cls='ov';
 if(t==='tbl'){h=`<h3>🍽️ Nomor Meja</h3><p class="mu" style="margin-bottom:12px">Masukkan nomor meja Anda untuk mulai memesan.</p><input id="tin" class="pin" style="letter-spacing:4px" maxlength="4" placeholder="03" value="${esc(C.table)}" onkeydown="if(event.key==='Enter')setTable()"><div class="row" style="margin-top:16px"><button class="b" style="width:100%" onclick="setTable()">Mulai Pesan</button></div>`}
 else if(t==='pin'){h=`<h3 style="text-align:center">🔒 ${M.staff?'Akses Staff':'PIN Admin'}</h3><input id="pi" class="pin" type="password" inputmode="numeric" maxlength="4" oninput="M.v=this.value" onkeydown="if(event.key==='Enter')submitPin()">${acts('submitPin()','Buka')}`}
 else if(t==='pay'){const tl=cTot(),ok=M.m==='qris'||M.c>=tl;h=`<h3>💳 Pembayaran</h3><div style="background:var(--primary);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:12px"><div class="mu" style="color:#fff">Total Tagihan</div><div style="font-size:30px;font-weight:800">${rp(tl)}</div></div>
 <div class="row" style="margin-bottom:12px"><button class="chip ${M.m==='cash'?'on':''}" style="flex:1" onclick="M.m='cash';render()">💵 Tunai</button><button class="chip ${M.m==='qris'?'on':''}" style="flex:1" onclick="M.m='qris';render()">📱 QRIS</button></div>
 ${M.m==='cash'?`<input id="pc" type="number" min="0" placeholder="Uang diterima" value="${M.c||''}" oninput="M.c=+this.value||0;payUpd()"><div class="chips" style="padding-top:10px">${[tl,20000,50000,100000].filter((v,i,a)=>a.indexOf(v)===i&&v>=tl).map(v=>`<button class="chip" onclick="M.c=${v};$('pc').value=${v};payUpd()">${rp(v)}</button>`).join('')}</div>`:`<div style="text-align:center">${S.qrisImage?`<img src="${S.qrisImage}" alt="QRIS" style="max-height:280px;margin:0 auto 8px;border-radius:12px">`:'<p class="mu">Gambar QRIS belum diunggah (Admin → Pengaturan Toko).</p>'}<p>Nominal: <b>${rp(tl)}</b></p></div>`}
 ${M.m==='cash'?`<div style="text-align:center;font-size:20px;font-weight:800;margin-top:6px" id="chg" class="${ok?'gr':'rd'}">${ok?'Kembalian ':'Kurang '}${rp(Math.abs(M.c-tl))}</div>`:''}
 <div class="row" style="margin-top:16px"><button class="b2" style="flex:1" onclick="M=null;render()">Batal</button><button id="pok" class="b" style="flex:1" onclick="doPay()" ${ok?'':'disabled'}>Konfirmasi</button></div>`}
 else if(t==='rc'){const r=M.r;h=`<div id="rc"><div style="text-align:center"><b style="font-size:16px">TUKO</b><br>Tuangin · Puterin · Nikmatin<br>${r.ts}<br>Kasir: ${esc(r.cashier||'-')} · ${esc(r.table||'-')}</div><hr style="margin:8px 0;border-top:1px dashed #999">${r.items.map(i=>`<div class="row"><span>${i.qty}x ${esc(i.name)}</span><span>${rp(i.price*i.qty)}</span></div>`).join('')}<hr style="margin:8px 0;border-top:1px dashed #999">${r.discount?`<div class="row"><span>Diskon</span><span>−${rp(r.discount)}</span></div>`:''}<div class="row"><b>TOTAL</b><b>${rp(r.total)}</b></div><div class="row"><span>Bayar (${r.method})</span><span>${rp(r.cash)}</span></div><div class="row"><span>Kembali</span><span>${rp(r.cash-r.total)}</span></div><p style="text-align:center;margin-top:10px">Terima kasih! 🙏</p></div>
 <div class="row" style="margin-top:14px"><button class="b2" style="flex:1" onclick="M=null;render()">Tutup</button><button class="b" style="flex:1" onclick="window.print()">🖨 Cetak</button></div>`}
 else if(t==='menu'){const m=M.m;h=`<h3>${m.id?'Edit':'Tambah'} Menu</h3>${fg('Nama',`<input id="mn" value="${esc(m.name||'')}">`)}${fg('Harga (Rp)',`<input id="mp" type="number" min="0" value="${m.price||''}">`)}${fg('Kategori',`<input id="mc" list="cl" value="${esc(m.cat||'')}"><datalist id="cl">${[...new Set(S.menu.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`)}<label class="row" style="justify-content:flex-start"><input type="checkbox" id="mb" style="width:auto" ${m.badge?'checked':''}> Badge “1 Teko”</label><label class="row" style="justify-content:flex-start;margin-top:6px"><input type="checkbox" id="ma" style="width:auto" ${m.active!==false?'checked':''}> Aktif (tersedia)</label>${acts('saveMenu()','Simpan')}`}
 else if(t==='exp'){const e=M.e;h=`<h3>${e.id?'Edit':'Catat'} Pengeluaran</h3>${fg('Deskripsi',`<input id="xd" value="${esc(e.desc||'')}">`)}${fg('Nominal (Rp)',`<input id="xn" type="number" min="0" value="${e.amount||''}">`)}${fg('Kategori',`<select id="xc">${Object.keys(CATS).map(k=>`<option value="${k}" ${e.cat===k?'selected':''}>${CATS[k]}</option>`).join('')}</select>`)}${acts('saveExp()','Simpan')}`}
 else if(t==='del'){h=`<h3>Hapus menu?</h3><p class="mu">Menu akan dihapus permanen.</p>${acts('S.menu=S.menu.filter(x=>x.id!==M.id);save();M=null;render()','Hapus')}`}
 else if(t==='xdel'){h=`<h3>Hapus pengeluaran?</h3><p class="mu">Catatan pengeluaran akan dihapus permanen.</p>${acts('S.expenses=S.expenses.filter(x=>x.id!==M.id);save();M=null;render()','Hapus')}`}
 else if(t==='rst'){h=`<h3 class="rd">Reset Data Selektif</h3>${[['trans','Transaksi'],['exp','Pengeluaran'],['sh','Riwayat shift'],['tab','Open tab'],['log','Log aktivitas'],['menu','Menu (kembali ke bawaan)']].map(x=>`<label class="row" style="justify-content:flex-start;margin-bottom:6px"><input type="checkbox" id="r_${x[0]}" style="width:auto"> ${x[1]}</label>`).join('')}${fg('Ketik RESET untuk konfirmasi','<input id="rt" placeholder="RESET">')}${acts('doReset()','Reset')}`}
 else if(t==='set'){h=`<h3>⚙️ Pengaturan Toko</h3>${fg('Gambar QRIS (maks 2MB)','<input type="file" accept="image/*" onchange="upQris(this)">')}${S.qrisImage?`<img src="${S.qrisImage}" alt="QRIS" style="max-height:200px;margin:8px auto;border-radius:10px"><button class="bd" onclick="S.qrisImage='';save();render()">Hapus QRIS</button>`:''}<div class="row" style="margin-top:16px"><button class="b" style="width:100%" onclick="M=null;render()">Selesai</button></div>`}
 else if(t==='open'){h=`<h3>🕐 Buka Shift Baru</h3>${fg('Nama shift',`<input id="sn" value="Shift - ${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}">`)}${fg('Nama kasir',`<input id="sk" value="${esc(S.cashierName||'')}">`)}${fg('Modal awal laci (Rp)','<input id="sc" type="number" min="0">')}${acts('doOpen()','Mulai Shift')}`}
 else if(t==='close'){h=`<h3>🔒 Tutup Shift</h3><div class="card" style="padding:12px"><div class="row"><span>Modal</span><span>${rp(S.shift.openingCash)}</span></div><div class="row"><span>Cash sales</span><span>+${rp(sCash())}</span></div><div class="row"><span>Pengeluaran</span><span>−${rp(sEx())}</span></div><div class="row"><b>Kas diharapkan</b><b>${rp(sExp())}</b></div></div>${fg('Uang fisik setoran (Rp)',`<input id="ca" type="number" min="0" oninput="closeUpd()">`)}<div class="row"><span>Selisih</span><b id="cv" class="rd">${rp(-sExp())}</b></div><div id="cnw">${fg('Catatan selisih','<textarea id="cn" rows="2"></textarea>')}</div>${acts('doClose()','Konfirmasi')}`}
 else if(t==='det'){const r=M.r;h=`<h3>Detail Shift</h3><b>${esc(r.name)}</b><div class="mu" style="margin-bottom:10px">${esc(r.cashierName)} · ${r.startedAtLabel} → ${r.closedAtLabel}</div><div class="g">${[['Modal Awal',r.openingCash],['Cash Sales',r.cashSales],['QRIS Sales',r.qrisSales],['Pengeluaran',r.expenseTotal],['Kas Diharapkan',r.expectedCash],['Uang Setoran',r.actualCash],['Selisih',r.variance],['Laba Bersih',r.netProfit]].map(x=>`<div class="row"><span>${x[0]}</span><b>${rp(x[1])}</b></div>`).join('')}</div>${r.note?`<p class="nt" style="margin-top:8px">${esc(r.note)}</p>`:''}<div class="row" style="margin-top:16px"><button class="b" style="width:100%" onclick="M=null;render()">Selesai</button></div>`}
 else if(t==='detDaily'){const d=M.d,tr=M.trans||[],ex=M.exps||[];const o=sum(tr,x=>x.total),x=sum(ex,e=>e.amount);
 h=`<h3>Rincian ${d}</h3><div class="g"><div class="row"><span>Omzet Kotor</span><b>${rp(o)}</b></div><div class="row"><span>Pengeluaran</span><b class="rd">${rp(x)}</b></div><div class="row"><span>Laba Bersih</span><b class="${o-x>=0?'gr':'rd'}">${rp(o-x)}</b></div><div class="row"><span>Jumlah Transaksi</span><b>${tr.length}</b></div></div>
 ${ex.length?`<div class="sc" style="margin-top:12px"><table><tr><th>Deskripsi</th><th>Kategori</th><th class="r">Nominal</th></tr>${ex.map(e=>`<tr><td>${esc(e.desc)}</td><td>${CATS[e.cat]||'-'}</td><td class="r">${rp(e.amount)}</td></tr>`).join('')}</table></div>`:''}
 ${tr.length?`<div class="sc" style="margin-top:12px"><table><tr><th>Waktu</th><th>Meja</th><th>Metode</th><th class="r">Total</th></tr>${tr.map(t=>`<tr><td>${t.ts}</td><td>${esc(t.table||'-')}</td><td>${t.method}</td><td class="r">${rp(t.total)}</td></tr>`).join('')}</table></div>`:''}
 <div class="row" style="margin-top:16px"><button class="b" style="width:100%" onclick="M=null;render()">Tutup</button></div>`}
 if(C.open&&cust&&!M)return '';
 return `<div class="${cls}" onclick="if(event.target===this&&'${t}'!=='tbl'){M=null;render()}"><div class="md">${h}</div></div>`}

/* ===== Cart sheet pembeli ===== */
const _render=render;
render=function(){_render();
 if(cust&&C.open&&!M){const tl=sum(C.cart,i=>i.price*i.qty);
  $('mdl').innerHTML=`<div class="ov sh" onclick="if(event.target===this){C.open=false;render()}"><div class="md"><div class="row" style="margin-bottom:12px"><div><h3 style="margin:0">Keranjang · Meja ${esc(C.table||'?')}</h3></div><button class="b2" onclick="C.open=false;render()">✕</button></div>
  ${C.cart.map(i=>`<div class="card row" style="align-items:flex-start;padding:12px;margin-bottom:8px"><div style="flex:1"><b>${esc(i.name)}</b><div class="mu">${rp(i.price)} × ${i.qty} = ${rp(i.price*i.qty)}</div><input style="margin-top:6px;font-size:12px" placeholder="Catatan (mis. es sedikit)" value="${esc(i.note)}" oninput="cNote(${i.id},this.value)"></div><div class="row" style="flex-direction:column"><button class="b2" onclick="cQty(${i.id},1)">+</button><b>${i.qty}</b><button class="b2" onclick="cQty(${i.id},-1)">−</button></div></div>`).join('')||'<p class="mu">Keranjang kosong</p>'}
  <div class="row" style="font-size:18px;font-weight:800;color:var(--primary);margin:10px 0"><span>Total</span><span>${rp(tl)}</span></div><button class="b" style="width:100%;padding:14px" onclick="cSend()" ${C.cart.length?'':'disabled'}>Kirim Pesanan ke Kasir</button></div></div>`}};

/* ===== INIT ===== */
(function(){const q=new URLSearchParams(location.search);if(q.get('mode')==='kasir'){cust=false}else{cust=true;initCust()}render()})();
</script>
</body>
