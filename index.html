<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUKO POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide-static/0.383.0/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{--sage:#4A6343;--sage-l:#5B7553;--olive:#8A9B7D;--olive-l:#DCE2D7;--cream:#F5F3EF;--ink:#1E293B;--radius:16px;--red:#c25454;--red-l:#fdeaea;--amber:#b8860b;--amber-l:#fdf6e3;--green:#2e7d32;--green-l:#e8f5e9;--blue:#1565c0;--blue-l:#e3f2fd;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--cream);color:var(--ink);font-family:'Segoe UI',ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;font-size:14px;}
button{font:inherit;cursor:pointer;border:none;}
input,select,textarea{font:inherit;}
img{display:block;max-width:100%;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--olive-l);border-radius:3px}

.app-shell{display:flex;height:100vh;overflow:hidden;}
.main-col{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.row{display:flex;flex:1;overflow:hidden;}

.sidebar{display:none;flex-direction:column;width:250px;flex-shrink:0;background:#fff;border-right:1px solid #e7e3da;padding:20px 16px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--sage),var(--sage-l));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0;}
.brand-name{font-weight:800;font-size:20px;color:var(--sage);letter-spacing:.3px;}
.slogan{font-size:11px;color:#a3a390;margin:2px 0 16px 48px;font-style:italic;}
.slogan-top{font-size:10px;color:#a3a390;margin-top:1px;font-style:italic;}
.nav-btn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;margin-bottom:4px;background:transparent;color:var(--ink);text-align:left;width:100%;transition:background .15s;position:relative;}
.nav-btn:hover{background:var(--cream);}
.nav-btn.active{background:var(--sage);color:#fff;}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid #eee;font-size:12px;color:#9a998e;}
.link-btn{background:none;color:var(--sage);text-decoration:underline;padding:0;margin-left:4px;}

.shift-badge{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;margin-bottom:14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.shift-badge.none{background:var(--amber-l);color:var(--amber);border-color:#ffe082;}
.shift-badge.none:hover{background:#fceec2;}
.shift-badge.active{background:var(--green-l);color:var(--green);border-color:#a5d6a7;}
.shift-badge.active:hover{background:#d4edda;}
.shift-badge-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;animation:pulse 1.8s infinite;}
.shift-badge.none .shift-badge-dot{background:var(--amber);}
.shift-badge.active .shift-badge-dot{background:var(--green);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.25)}}
.shift-badge-info{flex:1;min-width:0;overflow:hidden;}
.shift-badge-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shift-badge-sub{font-size:10px;opacity:.75;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.mobile-header{display:block;background:#fff;border-bottom:1px solid #e7e3da;padding:14px 16px;position:sticky;top:0;z-index:20;}
.mobile-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.mobile-brand{display:flex;align-items:center;gap:9px;}
.mobile-shift-badge{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.mobile-shift-badge.none{background:var(--amber-l);color:var(--amber);}
.mobile-shift-badge.active{background:var(--green-l);color:var(--green);}
.mobile-shift-badge .dot{width:7px;height:7px;border-radius:50%;}
.mobile-shift-badge.none .dot{background:var(--amber);}
.mobile-shift-badge.active .dot{background:var(--green);animation:pulse 1.8s infinite;}
.mobile-cats{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;}
.mobile-cats::-webkit-scrollbar{display:none;}

.content{flex:1;overflow-y:auto;padding:18px;}
.search-box{width:100%;max-width:420px;padding:11px 16px;border-radius:14px;border:1px solid #e7e3da;background:#fff;margin-bottom:16px;display:none;}
.search-box:focus{outline:2px solid var(--olive-l);}

.chips{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{background:var(--olive-l);color:var(--sage);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:all .15s;}
.chip.active{background:var(--sage);color:#fff;}

.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:90px;}
.product-card{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid #eee6d9;box-shadow:0 2px 10px rgba(74,99,67,.06);position:relative;transition:transform .15s;}
.product-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(74,99,67,.12);}
.product-img-wrap{position:relative;width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#DCE2D7 0%,#c8d1c2 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px;}
.product-img-text{font-weight:900;font-size:20px;color:var(--sage);text-align:center;line-height:1.2;letter-spacing:.3px;word-break:break-word;text-shadow:0 1px 2px rgba(255,255,255,.5);}
.product-img-text.small{font-size:16px;}
.badge-teko{position:absolute;top:10px;left:10px;background:var(--sage);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.3px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
.product-body{padding:12px 12px 14px;}
.product-name{font-weight:600;font-size:13.5px;line-height:1.35;min-height:2.6em;margin-bottom:8px;color:var(--ink);}
.product-foot{display:flex;align-items:center;justify-content:space-between;}
.product-price{font-weight:800;font-size:15px;color:var(--sage);}
.add-btn{background:var(--sage);color:#fff;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(74,99,67,.35);transition:background .15s,transform .1s;}
.add-btn:hover{background:var(--sage-l);}
.add-btn:active{transform:scale(.92);}
.add-btn:disabled{background:#b3b0a4;cursor:not-allowed;opacity:.55;}

.cart-panel{display:none;flex-direction:column;width:340px;flex-shrink:0;background:#fff;border-left:1px solid #e7e3da;}
.cart-header{padding:18px 18px 14px;border-bottom:1px solid #f0ede4;display:flex;justify-content:space-between;align-items:center;}
.cart-title{font-weight:700;font-size:16px;}
.icon-btn{background:none;color:#8a8a80;padding:4px;}
.cart-customer{padding:14px 18px;border-bottom:1px solid #f0ede4;}
.field{width:100%;padding:10px 13px;border-radius:11px;border:1px solid #e7e3da;background:var(--cream);font-size:13px;}
.field:focus{outline:2px solid var(--olive-l);background:#fff;}
.cart-items{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;}
.cart-empty{color:#b3b0a4;text-align:center;padding:50px 0;font-size:13px;}
.cart-item{display:flex;align-items:center;justify-content:space-between;}
.ci-name{font-weight:600;font-size:13px;}
.ci-price{font-size:11.5px;color:#a3a390;margin-top:2px;}
.qty-ctrl{display:flex;align-items:center;gap:10px;}
.qty-btn{width:26px;height:26px;border-radius:999px;background:var(--olive-l);color:var(--sage);display:flex;align-items:center;justify-content:center;font-weight:700;}
.qty-num{width:16px;text-align:center;font-weight:600;}
.cart-footer{padding:16px 18px 20px;border-top:1px solid #f0ede4;display:flex;flex-direction:column;gap:10px;}
.row-line{display:flex;justify-content:space-between;font-size:13px;}
.row-total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;}
.row-total span:last-child{color:var(--sage);}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.btn-outline{border:2px solid var(--sage);color:var(--sage);background:#fff;border-radius:14px;padding:13px 0;font-weight:700;font-size:13.5px;transition:background .15s;}
.btn-outline:hover{background:var(--cream);}
.btn-primary{background:var(--sage);color:#fff;border-radius:14px;padding:13px 0;font-weight:700;font-size:13.5px;box-shadow:0 4px 12px rgba(74,99,67,.3);transition:background .15s;}
.btn-primary:hover{background:var(--sage-l);}
.btn-primary:disabled,.btn-outline:disabled{opacity:.5;cursor:not-allowed;}

.mobile-cart-bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:14px 16px;justify-content:space-between;align-items:center;z-index:30;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.2);}
.mcb-left{display:flex;align-items:center;gap:10px;font-size:13.5px;}
.mcb-count{background:var(--olive-l);color:var(--sage);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.mcb-pay{background:var(--sage);color:#fff;padding:11px 22px;border-radius:13px;font-weight:700;font-size:13.5px;}

.overlay{position:fixed;inset:0;background:rgba(20,20,15,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.overlay.center{align-items:center;padding:16px;}
.drawer{background:var(--cream);width:100%;border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .22s ease-out;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:22px;animation:pop .15s ease-out;max-height:92vh;overflow-y:auto;}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-title{font-weight:700;font-size:16px;margin-bottom:14px;}

.pay-total-display{background:linear-gradient(135deg,#4A6343 0%,#5B7553 100%);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px;text-align:center;}
.pay-total-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;opacity:.8;margin-bottom:4px;}
.pay-total-amount{font-weight:900;font-size:28px;letter-spacing:.5px;}
.pay-quick-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pay-quick-chip{background:var(--olive-l);color:var(--sage);border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px;transition:all .15s;border:2px solid transparent;}
.pay-quick-chip:hover{background:var(--sage);color:#fff;}
.pay-quick-chip.active{background:var(--sage);color:#fff;border-color:var(--sage-l);}
.pay-input-group{margin-bottom:14px;}
.pay-input-group label{display:block;font-size:12px;font-weight:700;color:#6b6b60;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.pay-input-group label .hint{font-weight:500;font-size:11px;color:#a3a390;}
.pay-input-group input{width:100%;padding:14px 16px;font-size:20px;font-weight:800;text-align:right;border-radius:13px;border:2px solid #e7e3da;background:#fff;letter-spacing:.5px;}
.pay-input-group input:focus{outline:none;border-color:var(--sage);}
.pay-input-group input.invalid{border-color:var(--red);background:var(--red-l);}
.pay-change-box{border-radius:14px;padding:14px;margin-bottom:14px;text-align:center;}
.pay-change-box.ok{background:var(--green-l);border:1px solid #a5d6a7;}
.pay-change-box.short{background:var(--red-l);border:1px solid #ef9a9a;}
.pay-change-box .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;opacity:.8;}
.pay-change-box .val{font-weight:900;font-size:22px;}
.pay-change-box.ok .val{color:var(--green);}
.pay-change-box.short .val{color:var(--red);}
.pay-change-box .st{font-size:11.5px;margin-top:3px;font-weight:600;}
.pay-change-box.ok .st{color:var(--green);}
.pay-change-box.short .st{color:var(--red);}
.pay-method-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.pay-method-btn{padding:14px;border-radius:12px;font-weight:700;font-size:13px;border:2px solid #e7e3da;background:#fff;color:#6b6b60;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.pay-method-btn.active{background:var(--sage);color:#fff;border-color:var(--sage);}
.pay-method-btn.active.qris-method{background:var(--blue);border-color:var(--blue);}
.pay-actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-pay-confirm{background:var(--sage);color:#fff;border-radius:13px;padding:14px 0;font-weight:800;font-size:14px;box-shadow:0 4px 12px rgba(74,99,67,.3);display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-pay-confirm:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.btn-pay-cancel{background:var(--cream);color:#6b6b60;border-radius:13px;padding:14px 0;font-weight:700;font-size:14px;}

.qris-box{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid #e7e3da;}
.qris-header{text-align:center;margin-bottom:12px;}
.qris-brand{font-weight:800;font-size:15px;color:var(--ink);margin-bottom:3px;}
.qris-nmid{font-size:11px;color:#a3a390;font-family:monospace;letter-spacing:.5px;}
.qris-logo{font-weight:900;font-size:18px;color:#c62828;letter-spacing:1px;margin:8px 0 4px;display:inline-block;padding:3px 10px;border:2.5px solid #c62828;border-radius:6px;}
.qris-image-wrap{border:1px solid #e7e3da;border-radius:12px;overflow:hidden;background:#fff;position:relative;}
.qris-image-wrap img{width:100%;height:auto;display:block;}
.qris-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.qris-action-btn{background:#fff;border:1.5px solid #1565c0;color:#1565c0;border-radius:10px;padding:10px 8px;font-weight:700;font-size:11.5px;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:5px;text-transform:uppercase;transition:all .15s;}
.qris-action-btn:hover{background:var(--blue-l);}

.receipt{width:100%;max-width:300px;font-family:'Courier New',monospace;font-size:12px;}
.receipt-head{text-align:center;margin-bottom:8px;}
.receipt-head b{font-size:15px;color:var(--sage);}
.receipt-line{display:flex;justify-content:space-between;padding:2px 0;}
.dashed{border-top:1px dashed #ccc;margin:8px 0;}
.receipt-bold{font-weight:700;}
.print-btn{width:100%;background:var(--sage);color:#fff;border-radius:13px;padding:12px 0;font-weight:700;margin-top:14px;font-family:inherit;}
.close-link{width:100%;text-align:center;color:#b3b0a4;margin-top:8px;background:none;font-family:inherit;}

.pin-box{text-align:center;}
.pin-input{width:100%;text-align:center;font-size:26px;letter-spacing:14px;padding:12px 0;border-radius:13px;border:1px solid #e7e3da;background:var(--cream);margin-bottom:14px;}
.pin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.section-title{font-weight:700;font-size:17px;margin-bottom:16px;}
.card-plain{background:#fff;border-radius:16px;border:1px solid #eee6d9;padding:16px;}
.tabs-grid{display:grid;gap:12px;}
.tab-card{background:#fff;border-radius:16px;border:1px solid #eee6d9;padding:16px;display:flex;justify-content:space-between;align-items:center;}
.tab-name{font-weight:600;}
.tab-meta{font-size:11.5px;color:#a3a390;margin-top:2px;}
.tab-total{font-weight:800;color:var(--sage);text-align:right;}
.tab-resume{background:none;color:var(--sage);text-decoration:underline;font-size:12px;}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:16px;border:1px solid #eee6d9;padding:14px;}
.stat-label{font-size:11px;color:#a3a390;margin-bottom:5px;}
.stat-value{font-weight:800;font-size:15px;color:var(--sage);}
.chart-card{background:#fff;border-radius:16px;border:1px solid #eee6d9;padding:16px;margin-bottom:20px;}
.export-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.export-btn{background:var(--sage);color:#fff;border-radius:13px;padding:11px 18px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:13px;}
.import-btn{background:var(--olive-l);color:var(--sage);border-radius:13px;padding:11px 18px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
.danger-btn{background:var(--red);color:#fff;border-radius:13px;padding:11px 18px;font-weight:600;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 3px 10px rgba(194,84,84,.3);transition:background .15s;}
.danger-btn:hover{background:#a84040;}
.menu-table-wrap{background:#fff;border-radius:16px;border:1px solid #eee6d9;overflow-x:auto;margin-bottom:8px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:#a3a390;padding:12px;border-bottom:1px solid #f0ede4;font-weight:600;white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid #f6f4ee;vertical-align:middle;}
.log-list{font-size:12px;color:#8a8a80;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.role-badge{display:flex;align-items:center;gap:4px;}

.mm-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.mm-toolbar h3{font-weight:700;font-size:15px;margin:0;}
.mm-add-btn{background:var(--sage);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(74,99,67,.3);transition:background .15s,transform .1s;}
.mm-add-btn:hover{background:var(--sage-l);}
.mm-add-btn:active{transform:scale(.97);}
.mm-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.mm-stat-pill{background:var(--olive-l);color:var(--sage);padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:600;}
.mm-stat-pill.warn{background:var(--amber-l);color:var(--amber);}
.mm-stat-pill.off{background:var(--red-l);color:var(--red);}
.mm-thumb{width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#DCE2D7 0%,#c8d1c2 100%);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--sage);font-size:14px;flex-shrink:0;text-align:center;line-height:1;padding:4px;overflow:hidden;}
.mm-name-cell{display:flex;align-items:center;gap:10px;min-width:180px;}
.mm-name{font-weight:600;font-size:13px;line-height:1.3;}
.mm-badge-tiny{display:inline-block;background:var(--sage);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;letter-spacing:.3px;}
.mm-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer;transition:all .15s;user-select:none;border:none;}
.mm-status.aktif{background:var(--green-l);color:var(--green);}
.mm-status.habis{background:var(--red-l);color:var(--red);}
.mm-status:hover{transform:scale(1.05);}
.mm-actions{display:flex;gap:6px;justify-content:flex-end;}
.mm-icon-btn{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
.mm-icon-btn.edit{background:var(--olive-l);color:var(--sage);}
.mm-icon-btn.edit:hover{background:var(--sage);color:#fff;}
.mm-icon-btn.del{background:var(--red-l);color:var(--red);}
.mm-icon-btn.del:hover{background:var(--red);color:#fff;}

.pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;flex-wrap:wrap;margin-bottom:20px;}
.pg-info{font-size:12px;color:#8a8a80;}
.pg-controls{display:flex;align-items:center;gap:6px;}
.pg-btn{min-width:34px;height:34px;padding:0 10px;border-radius:9px;background:#fff;border:1px solid #e7e3da;color:var(--ink);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;}
.pg-btn:hover:not(:disabled){background:var(--olive-l);border-color:var(--sage);color:var(--sage);}

<div id="app"></div>
<script>
/* =========================================================
   TUKO POS — Storage & Seed
   ========================================================= */
const LS='tuko_v5';
const D=()=>JSON.parse(localStorage.getItem(LS));
const SV=s=>localStorage.setItem(LS,JSON.stringify(s));
const CATEGORIES=['Teh/Teko','Sate-satean','Kopi','Gorengan','Kudapan','Makanan','Minuman','Snack','Dessert','Lainnya'];
const EXPENSE_CATEGORIES=[
  {id:'bahan',label:'Belanja Bahan Baku',icon:'package',hint:'Teh, sate, gas, gula, es, dll'},
  {id:'ops',label:'Operasional',icon:'zap',hint:'Listrik, kebersihan, parkir, transport'},
  {id:'lainnya',label:'Lainnya',icon:'more-horizontal',hint:'Lain-lain / tak terduga'},
];
const CAT_LABEL={bahan:'Bahan Baku',ops:'Operasional',lainnya:'Lainnya'};

function defaultShiftName(){
 const d=new Date();
 const bulan=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
 return `Shift - ${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
}

function shortLabel(name){
  const t=String(name||'').replace(/\(.*?\)/g,'').trim();
  if(t.length<=10)return t;
  return t.split(' ').slice(0,2).join(' ');
}

function seed(){
 return {
  role:'kasir', pin:'1234', shift:null, shiftHistory:[], cashierName:'Kasir 1',
  dividendPct:30,
  qrisImage:'',
  menu:[
   {id:1,name:'Tuko Original (1 Teko)',price:13000,hpp:0,cat:'Teh/Teko',badge:true,active:true},
   {id:2,name:'Tuko Leci (1 Teko)',price:16000,hpp:0,cat:'Teh/Teko',badge:true,active:true},
   {id:3,name:'Tuko Lemon (1 Teko)',price:16000,hpp:0,cat:'Teh/Teko',badge:true,active:true},
   {id:4,name:'Tuko Beer (1 Teko)',price:18000,hpp:0,cat:'Teh/Teko',badge:true,active:true},
   {id:5,name:'Sate Telur Puyuh',price:4000,hpp:0,cat:'Sate-satean',badge:false,active:true},
   {id:6,name:'Sate Ati Ampela',price:3000,hpp:0,cat:'Sate-satean',badge:false,active:true},
   {id:7,name:'Sate Usus',price:3000,hpp:0,cat:'Sate-satean',badge:false,active:true},
  ],
  cart:[], tableNote:'', discount:0, tabs:[], petty:[], expenses:[], trans:[], log:[],
 };
}
if(!D())SV(seed());
let S=D();

// Migration
S.menu.forEach(m=>{
  if(typeof m.active==='undefined')m.active=true;
  if(typeof m.badge==='undefined')m.badge=false;
  m.hpp=0;
  if(m.img!==undefined)delete m.img;
});
if(!Array.isArray(S.shiftHistory))S.shiftHistory=[];
if(typeof S.shift==='undefined')S.shift=null;
if(!Array.isArray(S.expenses))S.expenses=[];
if(typeof S.dividendPct==='undefined')S.dividendPct=30;
if(typeof S.qrisImage==='undefined')S.qrisImage='';
if(!Array.isArray(S.petty))S.petty=[];
if(S.petty.length){
  S.petty.forEach(p=>{
    S.expenses.push({id:p.id,desc:p.desc,amount:p.amount,cat:'lainnya',ts:p.ts,tsRaw:p.tsRaw||new Date().toISOString(),legacy:true});
  });
  S.petty=[];

function pgSlice(arr,key){
  const p=PG[key];
  const total=arr.length;
  const totalPages=Math.max(1,Math.ceil(total/p.size));
  if(p.page>totalPages)p.page=totalPages;
  const start=(p.page-1)*p.size;
  return {items:arr.slice(start,start+p.size),total,totalPages,start};
}
function pgGo(key,page){PG[key].page=page;render();}
function pgSize(key,size){PG[key].size=+size;PG[key].page=1;render();}

function Pager(key,total,totalPages,start,count){
  if(total===0)return '';
  const cur=PG[key].page;
  const sizes=[5,10,25,50,100];
  let pages=[];
  if(totalPages<=7){
    for(let i=1;i<=totalPages;i++)pages.push(i);
  }else{
    pages.push(1);
    const s=Math.max(2,cur-1), e=Math.min(totalPages-1,cur+1);
    if(s>2)pages.push('...');
    for(let i=s;i<=e;i++)pages.push(i);
    if(e<totalPages-1)pages.push('...');
    pages.push(totalPages);
  }
  const end=start+count;
  return `<div class="pagination">
    <div class="pg-info">Menampilkan <b>${start+1}–${end}</b> dari <b>${total}</b> data</div>
    <div class="pg-controls">
      <button class="pg-btn" ${cur===1?'disabled':''} onclick="pgGo('${key}',1)" title="Halaman pertama">«</button>
      <button class="pg-btn" ${cur===1?'disabled':''} onclick="pgGo('${key}',${cur-1})" title="Sebelumnya">‹</button>
      ${pages.map(p=>p==='...'?`<span class="pg-ellipsis">…</span>`:`<button class="pg-btn ${p===cur?'active':''}" onclick="pgGo('${key}',${p})">${p}</button>`).join('')}
      <button class="pg-btn" ${cur===totalPages?'disabled':''} onclick="pgGo('${key}',${cur+1})" title="Berikutnya">›</button>
      <button class="pg-btn" ${cur===totalPages?'disabled':''} onclick="pgGo('${key}',${totalPages})" title="Halaman terakhir">»</button>
    </div>
    <div class="pg-size">
      <span>Per halaman:</span>
      <select onchange="pgSize('${key}',this.value)">
        ${sizes.map(s=>`<option value="${s}" ${PG[key].size===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
  </div>`;
}

/* ===== DATE HELPERS ===== */
function dateKey(iso){
  const d=new Date(iso);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function monthKey(iso){
  const d=new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function monthLabel(ym){
  const [y,m]=ym.split('-');
  const bulan=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${bulan[+m-1]} ${y}`;
}
function dateLabel(ymd){
  const [y,m,d]=ymd.split('-');
  const bulan=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

/* ===== SHIFT SESSION HELPERS ===== */
function isShiftActive(){return S.shift&&S.shift.status==='active';}

function shiftTrans(){
  if(!isShiftActive())return [];
  const start=new Date(S.shift.startedAt).getTime();
  return S.trans.filter(t=>new Date(t.tsRaw||t.ts).getTime()>=start);
}
function shiftExpenses(){
  if(!isShiftActive())return [];
  const start=new Date(S.shift.startedAt).getTime();
  return S.expenses.filter(e=>new Date(e.tsRaw||e.ts).getTime()>=start);
}
function shiftCashSales(){return shiftTrans().filter(t=>t.method==='cash').reduce((a,t)=>a+t.total,0);}
function shiftQrisSales(){return shiftTrans().filter(t=>t.method==='qris').reduce((a,t)=>a+t.total,0);}
function shiftExpenseTotal(){return shiftExpenses().reduce((a,e)=>a+e.amount,0);}
function shiftGrossRevenue(){return shiftTrans().reduce((a,t)=>a+t.total,0);}
function shiftNetProfit(){return shiftGrossRevenue()-shiftExpenseTotal();}
function shiftExpectedCash(){
  if(!isShiftActive())return 0;
  return S.shift.openingCash+shiftCashSales()-shiftExpenseTotal();
}

function transInShift(rec){
  const start=new Date(rec.startedAt).getTime();
  const end=new Date(rec.closedAt).getTime();
  return S.trans.filter(t=>{
    const ts=new Date(t.tsRaw||t.ts).getTime();
    return ts>=start && ts<=end;
  });
}
function expensesInShift(rec){
  const start=new Date(rec.startedAt).getTime();
  const end=new Date(rec.closedAt).getTime();
  return S.expenses.filter(e=>{
    const ts=new Date(e.tsRaw||e.ts).getTime();
    return ts>=start && ts<=end;
  });
}
function shiftRecGrossRevenue(rec){return transInShift(rec).reduce((a,t)=>a+t.total,0);}
function shiftRecCashSales(rec){return transInShift(rec).filter(t=>t.method==='cash').reduce((a,t)=>a+t.total,0);}
function shiftRecQrisSales(rec){return transInShift(rec).filter(t=>t.method==='qris').reduce((a,t)=>a+t.total,0);}
function shiftRecExpenseTotal(rec){return expensesInShift(rec).reduce((a,e)=>a+e.amount,0);}
function shiftRecNetProfit(rec){return shiftRecGrossRevenue(rec)-shiftRecExpenseTotal(rec);}
function shiftRecItemBreakdown(rec){
  const agg={};
  transInShift(rec).forEach(t=>t.items.forEach(i=>{
    if(!agg[i.id])agg[i.id]={name:i.name,cat:i.cat,qty:0,revenue:0};
    agg[i.id].qty+=i.qty;agg[i.id].revenue+=i.qty*i.price;
  }));
  return Object.values(agg).sort((a,b)=>b.qty-a.qty);
}

/* ===== MONTHLY REPORT ===== */
function availableMonths(){
  const set=new Set();
  S.trans.forEach(t=>set.add(monthKey(t.tsRaw||t.ts)));
  S.expenses.forEach(e=>set.add(monthKey(e.tsRaw||e.ts)));
  S.shiftHistory.forEach(sh=>set.add(monthKey(sh.closedAt)));
  return [...set].sort().reverse();
}
function monthSummary(ym){
  const isMonth=x=>monthKey(x)===ym;
  const trans=S.trans.filter(t=>isMonth(t.tsRaw||t.ts));
  const exp=S.expenses.filter(e=>isMonth(e.tsRaw||e.ts));
  const omzet=trans.reduce((a,t)=>a+t.total,0);
  const cashSales=trans.filter(t=>t.method==='cash').reduce((a,t)=>a+t.total,0);
  const qrisSales=trans.filter(t=>t.method==='qris').reduce((a,t)=>a+t.total,0);
  const totalExp=exp.reduce((a,e)=>a+e.amount,0);
  const expBahan=exp.filter(e=>(e.cat||'lainnya')==='bahan').reduce((a,e)=>a+e.amount,0);
  const expOps=exp.filter(e=>(e.cat||'lainnya')==='ops').reduce((a,e)=>a+e.amount,0);
  const expOther=exp.filter(e=>(e.cat||'lainnya')==='lainnya').reduce((a,e)=>a+e.amount,0);
  const laba=omzet-totalExp;
  const dividend=laba>0?laba*S.dividendPct/100:0;
  const retained=laba-dividend;
  return {ym,label:monthLabel(ym),omzet,cashSales,qrisSales,totalExp,expBahan,expOps,expOther,laba,dividend,retained,transCount:trans.length,expCount:exp.length};
}
function dailyBreakdown(ym){
  const isMonth=x=>monthKey(x)===ym;
  const map={};
  S.trans.filter(t=>isMonth(t.tsRaw||t.ts)).forEach(t=>{
    const k=dateKey(t.tsRaw||t.ts);
    if(!map[k])map[k]={omzet:0,cash:0,qris:0,exp:0,laba:0,trans:0,expCount:0};
    map[k].omzet+=t.total;
    if(t.method==='cash')map[k].cash+=t.total;else map[k].qris+=t.total;
    map[k].trans++;
  });
  S.expenses.filter(e=>isMonth(e.tsRaw||e.ts)).forEach(e=>{
    const k=dateKey(e.tsRaw||e.ts);
    if(!map[k])map[k]={omzet:0,cash:0,qris:0,exp:0,laba:0,trans:0,expCount:0};
    map[k].exp+=e.amount;
    map[k].expCount++;
  });
  return Object.entries(map).map(([date,v])=>({date,...v,laba:v.omzet-v.exp})).sort((a,b)=>a.date.localeCompare(b.date));
}

function PayModal(){

 const quickAmts=[...new Set([total,...[10000,20000,50000,100000].filter(a=>a>total)])].slice(0,4);
 return `<div class="overlay center" onclick="if(event.target===this)closePayModal()">

function saveMenuModal(){
 const d=menuModal.data;
 const name=(d.name||'').trim();
 if(!name){alert('Nama menu wajib diisi.');return;}
 const price=+d.price||0;
 if(price<=0){alert('Harga jual harus lebih dari 0.');return;}
 if(menuModal.mode==='add'){
  const newId=Date.now();
  S.menu.push({id:newId,name,cat:d.cat,price,hpp:0,badge:!!d.badge,active:d.active!==false});
  logA(`Menu baru ditambahkan: ${name} (${rp(price)})`);
  PG.menu.page=Math.ceil(S.menu.length/PG.menu.size);
 }else{
  const m=S.menu.find(x=>x.id===d.id);if(!m)return;
  m.name=name;m.cat=d.cat;m.price=price;m.hpp=0;m.badge=!!d.badge;m.active=d.active!==false;
  logA(`Menu diupdate: ${name}`);
 }
 menuModal=null;save();render();

function openSettingsModal(){

}
function closeSettingsModal(){settingsModal=null;render();}
function onQrisFileChange(input){
  const file=input.files[0];
  if(!file)return;
  if(file.size>1024*1024*2){
    alert('Ukuran gambar maksimal 2MB. Silakan kompres terlebih dahulu.');
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    if(settingsModal){
      settingsModal.qrisImage=e.target.result;
      render();
    }
  };
  reader.readAsDataURL(file);
}
function removeQrisImage(){
  if(!settingsModal)return;
  settingsModal.qrisImage='';
  render();
}

function onResetConfirmInput(v){
  if(!resetModal)return;
  resetModal.confirmText=v;

function executeReset(){
  if(!resetModal)return;
  if(resetModal.confirmText.trim()!=='RESET'){
    alert('Ketik "RESET" untuk konfirmasi.');
    return;
  }
  const sel=resetModal.selected;
  const itemsToReset=[];
  if(sel.trans){S.trans=[];itemsToReset.push('Transaksi');}
  if(sel.expenses){S.expenses=[];itemsToReset.push('Pengeluaran');}
  if(sel.shiftHistory){S.shiftHistory=[];itemsToReset.push('Riwayat Shift');}
  if(sel.tabs){S.tabs=[];itemsToReset.push('Open Tab');}
  if(sel.menu){S.menu=[];itemsToReset.push('Menu');}
  if(sel.log){S.log=[];itemsToReset.push('Log');}
  S.shift=null;
  S.cart=[];S.discount=0;S.tableNote='';
  if(!sel.log){
    S.log.unshift({a:`Reset Data: ${itemsToReset.join(', ')}`,ts:now()});

  save();
  resetModal=null;
  PG.menu.page=1;PG.trans.page=1;PG.sold.page=1;PG.log.page=1;PG.shiftHist.page=1;PG.expense.page=1;

/* Helper: parse angka dari string seperti "Rp 13.000" */
function parseNum(v){
  if(v === null || v === undefined || v === '') return 0;
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  const s = String(v).replace(/[^\d.-]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

/* Helper: normalisasi nama kolom (lowercase, tanpa spasi/underscore/dash/dot) */
function normalizeHeader(k){
  return String(k||'').toLowerCase().replace(/[\s_\-\.]/g,'');
}

/* Helper: ambil nilai dari row berdasarkan banyak kemungkinan nama kolom */
function pickField(row, candidates){
  for(const key of Object.keys(row)){
    const norm = normalizeHeader(key);
    for(const c of candidates){
      if(norm === normalizeHeader(c)){
        return row[key];
      }
    }
  }
  return undefined;
}

   })) : [{info:'Belum ada tab terbuka'}]
 ),'Open_Tab');

 // ===== SHEET LOG =====
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.log),'Log');

 // ===== SHEET PENGATURAN =====
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{
   pin: S.pin,
   cashierName: S.cashierName || '',
   dividendPct: S.dividendPct,
   qrisImage: S.qrisImage || '',
 }]),'Pengaturan');

 // ===== SHEET RINCIAN BULANAN (info saja) =====
 const monthlyRows=[];
 availableMonths().forEach(ym=>{
   const s=monthSummary(ym);
   monthlyRows.push({
     bulan:s.label, omzet_kotor:s.omzet, cash:s.cashSales, qris:s.qrisSales,
     pengeluaran_bahan_baku:s.expBahan, pengeluaran_operasional:s.expOps,
     pengeluaran_lainnya:s.expOther, total_pengeluaran:s.totalExp,
     laba_bersih:s.laba, persentase_dividen:S.dividendPct,
     alokasi_dividen:s.dividend, laba_ditahan:s.retained,
     jumlah_transaksi:s.transCount,
   });
 });
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(
   monthlyRows.length?monthlyRows:[{info:'Belum ada data'}]
 ),'Rincian_Bulanan');

 // ===== SHEET RINCIAN HARIAN (info saja) =====
 const dailyRows=[];
 availableMonths().forEach(ym=>{
   dailyBreakdown(ym).forEach(d=>{
     dailyRows.push({
       tanggal:d.date, omzet:d.omzet, cash:d.cash, qris:d.qris,
       pengeluaran:d.exp, laba_bersih:d.laba, jumlah_transaksi:d.trans,
     });
   });
 });
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(
   dailyRows.length?dailyRows:[{info:'Belum ada data'}]
 ),'Rincian_Harian');

 XLSX.writeFile(wb,`TUKO_Laporan_${Date.now()}.xlsx`);
 logA('Export data ke Excel (lengkap)');
}

/* ===== IMPORT EXCEL — SUPER TOLERAN ===== */
function importExcel(file){
  if(!file){
    alert('Tidak ada file yang dipilih.');
    return;
  }

  const reader = new FileReader();

  reader.onerror = () => {
    alert('Gagal membaca file. Coba pilih ulang file.');
  };

  reader.onload = (ev) => {
    try {
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, { type:'array' });

      console.log('[IMPORT] Sheets:', wb.SheetNames);

      // Hitung berapa sheet yang berhasil dibaca
      const imported = {
        menu: 0,
        expenses: 0,
        trans: 0,
        shiftHistory: 0,
        tabs: 0,
        log: 0,
        settings: false,
      };

      // Helper: cari sheet case-insensitive
      const findSheet = (aliases) => wb.SheetNames.find(n =>
        aliases.map(a=>normalizeHeader(a)).includes(normalizeHeader(n))
      );

      // ==================== 1. MENU ====================
      const menuSheet = findSheet(['menu','daftarmenu','daftar_menu','products','produk']);
      if(menuSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[menuSheet], { defval:'' });
        console.log('[IMPORT] Menu rows:', rows.length);
        const newMenu = [];
        rows.forEach((row, i) => {
          const name = String(pickField(row, ['name','nama','namamenu','menu','produk','product']) || '').trim();
          if(!name) return;
          const cat = String(pickField(row, ['cat','kategori','category','kategorimenu','type']) || 'Lainnya').trim() || 'Lainnya';
          const price = parseNum(pickField(row, ['price','harga','hargajual','hargasatuan']));
          const hpp = parseNum(pickField(row, ['hpp','modal','hppmodal','cost']));
          const badgeRaw = pickField(row, ['badge','badge1teko','isteeko','teko']);
          const badge = badgeRaw === true || badgeRaw === 'true' || badgeRaw === 'TRUE' || badgeRaw === 1 || badgeRaw === '1' || badgeRaw === 'ya' || badgeRaw === 'Ya';
          const activeRaw = pickField(row, ['active','aktif','status','isactive','is_active']);
          const active = !(activeRaw === false || activeRaw === 'false' || activeRaw === 'FALSE' || activeRaw === 0 || activeRaw === '0' || activeRaw === 'nonaktif' || activeRaw === 'Nonaktif');
          newMenu.push({
            id: parseNum(pickField(row, ['id'])) || (Date.now() + i),
            name, cat, price, hpp, badge, active
          });
        });
        if(newMenu.length){
          S.menu = newMenu;
          imported.menu = newMenu.length;
        }
      }

      // ==================== 2. PENGELUARAN ====================
      const expSheet = findSheet(['pengeluaran','expenses','expense','belanja','belanjausaha','kaskeluar']);
      if(expSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[expSheet], { defval:'' });
        console.log('[IMPORT] Pengeluaran rows:', rows.length);
        const newExp = [];
        rows.forEach((row, i) => {
          const desc = String(pickField(row, ['keterangan','desc','description','deskripsi','nama','item','uraian','catatan']) || '').trim();
          if(!desc) return;
          const amount = parseNum(pickField(row, ['nominal','amount','jumlah','total','harga','biaya','value']));
          if(amount <= 0) return;

          // Kategori: prioritas kolom 'cat' (raw: bahan/ops/lainnya) > 'kategori' (label Indonesia)
          let cat = 'lainnya';
          const catRaw = String(pickField(row, ['cat']) || '').toLowerCase();
          if(['bahan','ops','lainnya'].includes(catRaw)){
            cat = catRaw;
          } else {
            const katLabel = String(pickField(row, ['kategori','category','jenis','tipe','type']) || '').toLowerCase();
            if(katLabel.includes('bahan') || katLabel.includes('baku')) cat = 'bahan';
            else if(katLabel.includes('operasional') || katLabel.includes('ops')) cat = 'ops';
          }

          const ts = pickField(row, ['tanggal','ts','date','waktu','time']) || now();
          const tsRaw = pickField(row, ['tsRaw','tsraw']) || ts;

          newExp.push({
            id: parseNum(pickField(row, ['id'])) || (Date.now() + i),
            desc, amount, cat,
            ts: typeof ts === 'string' ? ts : now(),
            tsRaw: typeof tsRaw === 'string' ? tsRaw : nowISO(),
            shiftId: pickField(row, ['shiftId','shiftid']) || '',
            shiftName: pickField(row, ['shift','shiftname']) || '-'
          });
        });
        if(newExp.length){
          S.expenses = newExp;
          imported.expenses = newExp.length;
        }
      }

      // ==================== 3. TRANSAKSI ====================
      const transSheet = findSheet(['transaksi','transactions','trans']);
      if(transSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[transSheet], { defval:'' });
        console.log('[IMPORT] Transaksi rows:', rows.length);
        const newTrans = [];
        rows.forEach((row, i) => {
          const id = parseNum(pickField(row, ['id'])) || (Date.now() + i);
          const ts = pickField(row, ['ts','tanggal','date','waktu']) || now();
          const tsRaw = pickField(row, ['tsRaw','tsraw']) || ts;
          const table = String(pickField(row, ['table','meja','nama']) || '');
          const cashier = String(pickField(row, ['cashier','kasir']) || '');
          const method = String(pickField(row, ['method','metode','payment']) || 'cash').toLowerCase();
          const total = parseNum(pickField(row, ['total','nominal','amount']));
          const cash = parseNum(pickField(row, ['cash','bayar','tunai'])) || total;

          if(total <= 0) return;

          // Parse items: coba itemsJson dulu (JSON array), fallback ke items (string label)
          let items = [];
          const itemsJson = pickField(row, ['itemsJson','itemsjson','items_json']);
          if(itemsJson){
            try{
              const parsed = JSON.parse(itemsJson);
              if(Array.isArray(parsed)) items = parsed;
            }catch(e){ console.warn('Parse itemsJson gagal:', e); }
          }
          if(items.length === 0){
            // Fallback: parse dari string "2x Menu A, 1x Menu B"
            const itemsStr = String(pickField(row, ['items']) || '');
            if(itemsStr){
              items = itemsStr.split(',').map(part => {
                const m = part.trim().match(/^(\d+)x\s+(.+)$/);
                if(m){
                  const qty = +m[1];
                  const name = m[2].trim();
                  // Cari harga dari S.menu
                  const menuItem = S.menu.find(mm => mm.name === name);
                  const price = menuItem ? menuItem.price : 0;
                  const cat = menuItem ? menuItem.cat : 'Lainnya';
                  return { id: menuItem ? menuItem.id : 0, name, qty, price, cat, hpp:0, badge:false, active:true };
                }
                return null;
              }).filter(Boolean);
            }
          }

          newTrans.push({
            id, items, total, method, cash,
            ts: typeof ts === 'string' ? ts : now(),
            tsRaw: typeof tsRaw === 'string' ? tsRaw : nowISO(),
            table, cashier,
            shiftId: pickField(row, ['shiftId','shiftid']) || '',
            shiftName: pickField(row, ['shiftName','shiftname','shift']) || ''
          });
        });
        if(newTrans.length){
          S.trans = newTrans;
          imported.trans = newTrans.length;
        }
      }

      // ==================== 4. LAPORAN SHIFT ====================
      const shiftSheet = findSheet(['laporanshift','laporan_shift','laporanshift','shift']);
      if(shiftSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[shiftSheet], { defval:'' });
        console.log('[IMPORT] Laporan_Shift rows:', rows.length);
        const newHist = [];
        rows.forEach((row, i) => {
          const id = String(pickField(row, ['id_shift','idshift','id']) || '');
          if(!id) return;

          const name = String(pickField(row, ['nama_shift','namashift','name']) || '-');
          const cashierName = String(pickField(row, ['nama_kasir','namakasir','cashier']) || '-');
          const startedAt = pickField(row, ['startedAt','startedat']) || '';
          const closedAt = pickField(row, ['closedAt','closedat']) || nowISO();
          const startedAtLabel = pickField(row, ['tanggal_buka','tanggalbuka']) || '';
          const closedAtLabel = pickField(row, ['tanggal_tutup','tanggalttutup','tanggalttutup']) || '';

          const openingCash = parseNum(pickField(row, ['modal_awal','modalawal']));
          const cashSales = parseNum(pickField(row, ['total_penjualan_cash','totalpenjualancash']));
          const qrisSales = parseNum(pickField(row, ['total_qris','totalqris']));
          const expenseTotal = parseNum(pickField(row, ['total_pengeluaran','totalpengeluaran']));
          const expectedCash = parseNum(pickField(row, ['kas_diharapkan','kasdiharapkan']));
          const actualCash = parseNum(pickField(row, ['uang_fisik_setoran','uangfisiksetoran','uang_fisik']));
          const variance = parseNum(pickField(row, ['selisih_uang','selisihuang']));
          const grossRevenue = parseNum(pickField(row, ['omzet_shift','omzetshift']));
          const netProfit = parseNum(pickField(row, ['laba_bersih_shift','lababersihshift']));
          const note = String(pickField(row, ['catatan','note']) || '');

          newHist.push({
            id, name, cashierName,
            startedAt, startedAtLabel,
            closedAt, closedAtLabel,
            openingCash, cashSales, qrisSales, expenseTotal,
            expectedCash, actualCash, variance,
            grossRevenue, netProfit,
            note,
            transCount: 0, expenseCount: 0,
          });
        });
        if(newHist.length){
          S.shiftHistory = newHist;
          imported.shiftHistory = newHist.length;
        }
      }

      // ==================== 5. OPEN TAB ====================
      const tabSheet = findSheet(['opentab','open_tab','tabs','tab']);
      if(tabSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[tabSheet], { defval:'' });
        console.log('[IMPORT] Open_Tab rows:', rows.length);
        const newTabs = [];
        rows.forEach((row, i) => {
          const id = parseNum(pickField(row, ['id'])) || (Date.now() + i);
          const table = String(pickField(row, ['table','meja','nama']) || '');
          const total = parseNum(pickField(row, ['total']));
          const ts = pickField(row, ['ts','tanggal']) || now();
          const tsRaw = pickField(row, ['tsRaw','tsraw']) || ts;

          // Parse items
          let items = [];
          const itemsJson = pickField(row, ['itemsJson','itemsjson','items_json']);
          if(itemsJson){
            try{
              const parsed = JSON.parse(itemsJson);
              if(Array.isArray(parsed)) items = parsed;
            }catch(e){}
          }
          if(items.length === 0){
            const itemsStr = String(pickField(row, ['items']) || '');
            if(itemsStr){
              items = itemsStr.split(',').map(part => {
                const m = part.trim().match(/^(\d+)x\s+(.+)$/);
                if(m){
                  const qty = +m[1];
                  const name = m[2].trim();
                  const menuItem = S.menu.find(mm => mm.name === name);
                  return {
                    id: menuItem ? menuItem.id : 0,
                    name, qty,
                    price: menuItem ? menuItem.price : 0,
                    cat: menuItem ? menuItem.cat : 'Lainnya',
                    hpp: 0, badge: false, active: true
                  };
                }
                return null;
              }).filter(Boolean);
            }
          }

          // Skip baris kosong
          if(!table && items.length === 0) return;

          newTabs.push({
            id, items, table, total,
            ts: typeof ts === 'string' ? ts : now(),
            tsRaw: typeof tsRaw === 'string' ? tsRaw : nowISO(),
          });
        });
        S.tabs = newTabs;
        imported.tabs = newTabs.length;
      }

      // ==================== 6. LOG ====================
      const logSheet = findSheet(['log','logs','aktivitas']);
      if(logSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[logSheet], { defval:'' });
        console.log('[IMPORT] Log rows:', rows.length);
        const newLog = [];
        rows.forEach((row) => {
          const a = String(pickField(row, ['a','aktivitas','activity','action']) || '').trim();
          const ts = pickField(row, ['ts','timestamp','tanggal','waktu']) || now();
          if(!a) return;
          newLog.push({ a, ts: typeof ts === 'string' ? ts : now() });
        });
        if(newLog.length){
          S.log = newLog;
          imported.log = newLog.length;
        }
      }

      // ==================== 7. PENGATURAN ====================
      const setSheet = findSheet(['pengaturan','settings','config','konfigurasi']);
      if(setSheet){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[setSheet], { defval:'' });
        if(rows.length){
          const row = rows[0];
          const pin = String(pickField(row, ['pin']) || '').trim();
          const cashierName = String(pickField(row, ['cashierName','cashiername','kasir']) || '').trim();
          const dividendPct = parseNum(pickField(row, ['dividendPct','dividendpct','dividen']));
          const qrisImage = String(pickField(row, ['qrisImage','qrisimage','qris']) || '');

          if(pin) S.pin = pin;
          if(cashierName) S.cashierName = cashierName;
          if(dividendPct >= 0 && dividendPct <= 100) S.dividendPct = dividendPct;
          if(qrisImage) S.qrisImage = qrisImage;

          imported.settings = true;
          console.log('[IMPORT] Pengaturan di-import');
        }
      }

      // ==================== HASIL ====================
      const totalImported = imported.menu + imported.expenses + imported.trans +
                            imported.shiftHistory + imported.tabs + imported.log +
                            (imported.settings ? 1 : 0);

      if(totalImported === 0){
        alert('⚠ File berhasil dibaca, tapi tidak ada data yang valid.\n\nSheet yang ada: ' + wb.SheetNames.join(', '));
        return;
      }

      // Simpan log & state
      logA(`Import dari Excel: ${imported.menu} menu, ${imported.expenses} pengeluaran, ${imported.trans} transaksi, ${imported.shiftHistory} shift, ${imported.tabs} tab`);
      save();
      view = 'admin';
      adminUnlocked = true;
      PG.menu.page = 1;
      PG.expense.page = 1;
      PG.trans.page = 1;
      PG.sold.page = 1;
      PG.log.page = 1;
      PG.shiftHist.page = 1;

      // Render
      render();

      // Alert ringkasan
      const lines = [];
      if(imported.menu) lines.push(`• Menu: ${imported.menu} item`);
      if(imported.expenses) lines.push(`• Pengeluaran: ${imported.expenses} item`);
      if(imported.trans) lines.push(`• Transaksi: ${imported.trans} item`);
      if(imported.shiftHistory) lines.push(`• Riwayat Shift: ${imported.shiftHistory} item`);
      if(imported.tabs) lines.push(`• Open Tab: ${imported.tabs} item`);
      if(imported.log) lines.push(`• Log: ${imported.log} item`);
      if(imported.settings) lines.push(`• Pengaturan: ✔`);

      setTimeout(() => {
        alert(`✅ Import berhasil!\n\n${lines.join('\n')}`);
      }, 100);

    } catch(err){
      console.error('[IMPORT] Error lengkap:', err);
      alert('❌ Gagal memproses file.\n\nDetail: ' + err.message + '\n\nCek Console (F12) untuk info teknis.');
    }
  };

  reader.readAsArrayBuffer(file);
}

/* =========================================================

   ========================================================= */
function tryAdmin(cb){pinModal={cb:cb||null,val:''};render();}
function checkPin(){
  if(!pinModal)return;
  if(pinModal.val===S.pin){
    adminUnlocked=true;
    const cb=pinModal.cb;
    pinModal=null;
    try{
      render();
      if(cb)cb();
    }catch(e){
      console.error('Render error:', e);
      alert('Terjadi error saat membuka admin: ' + e.message);
    }
  }else{
    alert('PIN salah');
    pinModal.val='';
    render();
  }
}

function Icon(n,cls){
  // Kalau lucide tersedia, pakai
  if(typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function'){
    return `<i data-lucide="${n}" class="${cls||''}"></i>`;
  }
  // Fallback unicode kalau CDN gagal load
  const fallback = {
    'shopping-bag':'🛍', 'clipboard-list':'📋', 'wallet':'💼', 'shield':'🛡',
    'clock':'🕐', 'play-circle':'▶', 'lock':'🔒', 'check-circle':'✓',
    'x-circle':'✕', 'plus':'+', 'plus-circle':'⊕', 'trash-2':'🗑',
    'pencil':'✎', 'x':'✕', 'info':'ℹ', 'credit-card':'💳', 'banknote':'💵',
    'qr-code':'▦', 'image-off':'🚫', 'tag':'🏷', 'share-2':'↗',
    'alert-triangle':'⚠', 'alert-octagon':'⛔', 'settings':'⚙',
    'key-round':'🔑', 'upload-cloud':'☁', 'upload':'↑', 'download':'↓',
    'refresh-cw':'↻', 'pie-chart':'◐', 'list':'☰', 'package':'📦',
    'zap':'⚡', 'more-horizontal':'⋯', 'trending-up':'↗', 'trending-down':'↘',
    'user':'👤', 'search':'🔍', 'shopping-cart':'🛒',
  };
  const emoji = fallback[n] || '•';
  return `<span class="${cls||''}" style="display:inline-flex;align-items:center;justify-content:center">${emoji}</span>`;
}
function Logo(size){return `<div class="brand-logo" style="width:${size}px;height:${size}px;font-size:${size*.42}px">T</div>`;}

 window.m=S.menu;

 if(view==='admin' && !adminUnlocked && !pinModal){

 }

 let content;
 if(view==='pos')content=ProductGrid();
 else if(view==='tabs')content=TabsView();
 else if(view==='expenses')content=ExpensesView();
 else if(view==='admin')content=AdminView();
 else if(view==='shift')content=ShiftView();

 document.getElementById('app').innerHTML=`
  <div class="app-shell">
   ${Nav()}
   <div class="main-col">
    ${MobileHeader()}
    <div class="row">${content}${view==='pos'?CartPanel(false):''}</div>
   </div>
  </div>
  ${view==='pos'?MobileCartBar():''}
  ${cartOpen?CartPanel(true):''}
  ${modal&&modal.type==='pay'?PayModal():''}
  ${modal&&modal.type==='receipt'?ReceiptModal(modal.t):''}

  ${expenseModal?ExpenseModal():''}

  ${sessionModal&&sessionModal.mode==='close'?CloseShiftModal():''}
  ${sessionModal&&sessionModal.mode==='success'?ShiftSuccessModal():''}
  ${detailShift?ShiftDetailModal():''}
  ${resetModal?ResetModal():''}
  ${settingsModal?SettingsModal():''}
 `;

 // Panggil createIcons HANYA kalau lucide tersedia
 if(typeof lucide !== 'undefined' && lucide && typeof lucide.createIcons === 'function'){
   try{ lucide.createIcons(); }catch(e){ console.warn('Lucide error:', e); }
 }

 if(pinModal){
   setTimeout(()=>{
     const inp=document.querySelector('.pin-input');
     if(inp)inp.focus();
   },50);
 }

 if(view==='admin'&&adminUnlocked){
  const ctx=document.getElementById('profitChart');
  if(ctx){if(window._chart)window._chart.destroy();
   window._chart=new Chart(ctx,{type:'bar',data:{labels:['Omzet Kotor','Pengeluaran','Laba Bersih'],datasets:[{data:[grossRevenue(),totalExpense(),netProfit()],backgroundColor:['#8A9B7D','#c9b8a3','#4A6343'],borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'Rp'+(v/1000)+'rb'}}}}});
  }
 }
 if(modal&&modal.type==='pay'&&payState){
  const inp=document.getElementById('payCashInput');
  if(inp&&document.activeElement!==inp){
    if(!inp.dataset.focused){
      inp.focus();
      inp.dataset.focused='1';
    }
  }
 }
}
render();
